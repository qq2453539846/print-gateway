# 扫码打印网关 —— 一条命令跑起来
#
#   docker compose up -d
#
# 起来之后：
#   · 电脑浏览器打开  http://<这台机器的IP>:8080      ← 打印面板
#   · 手机打开同一地址（或扫管理页印的连接码）         ← 上传就打印
#   · 局域网其他电脑添加打印机，地址填 <IP>:631（IPP） ← 不需要装同型驱动

services:
  print-gateway:
    build:
      context: .
      args:
        # Debian 软件源。默认用阿里云镜像：国内直连 deb.debian.org 实测会
        # connection timed out，构建卡在 apt-get update 上。
        # 在境外构建时改回 deb.debian.org 即可。
        DEBIAN_MIRROR: mirrors.aliyun.com
    image: print-gateway:local
    container_name: print-gateway

    # unless-stopped：重启策略只影响容器本身，不动宿主其他服务
    restart: unless-stopped

    ports:
      # 网页入口。手机扫码、App、电脑浏览器都进这里。
      # 宿主 8080 已被占用时（比如机器上还跑着一个裸机实例）换一个：
      #   HTTP_PORT=18080 docker compose up -d
      - "${HTTP_PORT:-8080}:8080"

      # ── CUPS / IPP 入口（默认关闭，按需打开）────────────────────────
      # 打开它，局域网其他电脑就能把这条打印机直接加进去：
      # 地址填 <这台机器的IP>:631，不需要装同型驱动。
      #
      # 为什么默认注释掉：
      #   1) 宿主已经跑着 CUPS 时，631 端口被占用，`docker compose up` 会直接失败：
      #        Error starting userland proxy: bind: address already in use
      #      而「宿主有 CUPS」恰恰是本项目最常见的场景 —— 网关本来就是包着 CUPS 的
      #   2) 那种情况下正确的做法是打开下面 environment 里的 CUPS_SERVER，
      #      让容器不要再起第二套 cupsd，也就不需要这个映射
      #
      # ⚠️ 无论何时都别把 631 暴露到公网 —— IPP 提交作业默认免鉴权
      # - "631:631"

    environment:
      # 这几项都可以用同目录的 .env 覆盖（样板见 .env.example）
      TZ: ${TZ:-Asia/Shanghai}
      TITLE: ${TITLE:-扫码打印}
      # 单文件上传上限（MB）
      MAX_MB: ${MAX_MB:-50}
      # 管理页口令。留空 = /admin 整体关闭（本项目不提供无口令的管理页）
      # ADMIN_TOKEN: "换成你自己的口令"
      # 界面上展示的访问地址。多网卡机器建议显式指定，否则可能探测到错的那张网卡
      # HOST_DISPLAY: "192.168.1.10"
      # 宿主已经装好 CUPS 时填这一行：切到「模式 B」，容器内不再起 cupsd，
      # 避免两套队列互相打架
      # CUPS_SERVER: "192.168.1.10:631"
      # 走第三方内网穿透 / 反向代理时填（如 ddnsto 的域名映射）。这类部署下
      # TLS 在隧道边缘终结、容器自己不起 TLS，但公网码要指向隧道域名。
      # 填了它**必须同时填 TOKEN**，否则服务直接拒绝启动。
      # PUBLIC_URL: "https://xxxx.ddnsto.com"
      # ⚠️ 此类部署另有一条坑：/admin 的「仅限内网」判的是源 IP，而穿透客户端
      #    就在局域网内 ⇒ 公网请求的源 IP 成了内网地址，这道关会失效。
      #    公网那份实例请**不要**设 ADMIN_TOKEN（改配置走内网）

    devices:
      # USB 打印机直通。
      # /dev/bus/usb 在 Linux 上总是存在，所以这行不会让容器起不来 ——
      # 没有打印机时它只是个空目录，插上打印机重建容器即可看到。
      # 如果你的发行版走 usblp 且希望队列直接用 /dev/usb/lp0，换成：
      #   - /dev/usb/lp0:/dev/usb/lp0
      - /dev/bus/usb:/dev/bus/usb

    volumes:
      # 队列 / PPD / 打印机配置：重建容器不丢
      - ./data/cups:/etc/cups
      # 作业与预览缓存
      - ./data/spool:/var/spool/print-gateway
      # cupsd 的 unix socket 目录。公网那份实例靠它连过来 ——
      # CUPS 不认带连字符的主机名（会当成 URL scheme），走 socket
      # 既躲开这个坑，也不必依赖会变的容器 IP。理由详见文档。
      - ./data/run-cups:/run/cups

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

    # ────────────────────────────────────────────────────────────────
    # 想让 iOS / macOS 在「添加打印机」里自动发现队列？
    # mDNS 多播出不了默认的 bridge 网络。需要宿主网络栈，做法是：
    #   1) 把上面 ports: 整段注释掉（host 模式下端口直接绑宿主，不能同时声明映射）
    #   2) 取消下面这行注释
    # 不介意手动填 IP 的话，保持现状即可 —— 扫码打印主流程不需要 mDNS。
    # network_mode: host

  # ═══════════════════════════════════════════════════════════════════
  #  内网穿透：没有公网 IP、也没有自有域名时的远程访问
  #
  #  全部收在 tunnel profile 下 —— 不启用时下面两个服务根本不会起来，
  #  对原有的内网部署零影响。
  #
  #     cp .env.example .env          # 填 DDNSTO_TOKEN / PUBLIC_TOKEN / PUBLIC_URL
  #     docker compose --profile tunnel up -d
  #
  #  起来之后，到 DDNSTO 控制台加一条「域名映射」：
  #     https://你拿到的地址   →   http://<这台机器的IP>:8081
  #
  #  为什么要多起一个实例，而不是让隧道直接指 8080：
  #    8080 是刻意免密的（内网扫码即用），挂到公网等于「谁访问到谁就能
  #    上传文件直接打印」。所以对外的必须是带口令的那一份。
  # ═══════════════════════════════════════════════════════════════════

  print-gateway-pub:
    build:
      context: .
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
    image: print-gateway:local
    container_name: print-gateway-pub
    restart: unless-stopped
    profiles: ["tunnel"]

    ports:
      # 只给隧道客户端用；不要在小路由器上把它直接 DNAT 出去。
      # 换了宿主端口的话，DDNSTO 控制台里的映射目标要跟着改
      - "${PUB_HTTP_PORT:-8081}:8081"

    environment:
      PORT: "8081"
      SPOOL_DIR: /var/spool/print-gateway
      TITLE: ${TITLE:-扫码打印}
      # 公网入口必须有口令。下面这个开关保证「漏填就起不来」，
      # 而不是静默降级成一个免密的 8081 挂到隧道后面
      REQUIRE_TOKEN: "1"
      TOKEN: ${PUBLIC_TOKEN:-}
      # 告诉网关公网入口在哪，否则二维码贴纸里的「公网码」印不出来
      PUBLIC_URL: ${PUBLIC_URL:-}
      # 复用 print-gateway 容器里的 cupsd：全机只有一套 CUPS、一份队列，
      # 不必把 USB 再直通一次，也不会出现两套队列互相打架。
      #
      # 这里必须写 socket 路径，**不能**写「服务名:631」——
      # CUPS 会把 print-gateway:631 里的 print-gateway 当成 URL scheme
      # （字母与连字符都是 scheme 的合法字符），于是报：
      #   lpstat: Error - add '/version=1.1' to server name.
      # 换成容器 IP 确实能用，但 IP 会随重建而变；共享 socket 最稳。
      CUPS_SERVER: /run/cups/cups.sock
      # ⚠️ 刻意不设 ADMIN_TOKEN：/admin 的「仅限内网」判的是源 IP，而隧道
      #    客户端就站在局域网里 ⇒ 公网请求的源 IP 是内网地址 ⇒ 这道关会被
      #    反向绕过。要改配置请走内网那份 8080。

    volumes:
      # 只挂自己的预览缓存。队列配置留在主容器那份，这里不要重复挂 /etc/cups
      - ./data/spool-pub:/var/spool/print-gateway
      # 与主容器共享 cupsd 的 unix socket（对应上面的 CUPS_SERVER）
      - ./data/run-cups:/run/cups

    depends_on:
      - print-gateway

  ddnsto:
    # DDNSTO 客户端（易有云出品），镜像约 3MB，x86 / arm 都有。
    # 它只往外建连接，隧道是「公网 → 本机」方向的，所以给宿主网络最省事。
    image: linkease/ddnsto
    container_name: print-gateway-ddnsto
    restart: unless-stopped
    profiles: ["tunnel"]
    network_mode: host

    environment:
      # 登录 https://www.ddnsto.com/ ，控制台右上角复制令牌
      TOKEN: ${DDNSTO_TOKEN:-}
      # 同一局域网里多台设备跑 ddnsto 时改这里，避免设备 ID 撞车
      DEVICE_IDX: ${DEVICE_IDX:-0}
      TZ: ${TZ:-Asia/Shanghai}

    volumes:
      - /etc/localtime:/etc/localtime:ro
