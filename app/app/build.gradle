plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.printgw.selfservice'
    compileSdk 34

    defaultConfig {
        applicationId "com.printgw.selfservice"
        // minSdk 26：Android 8.0 起才有完整的自适应图标与 SAF 行为，
        // 且 8.0 以下设备已极为罕见。图标因此可以纯 vector 实现，无需位图。
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // 自用场景：release 也用 debug keystore 签名，装的时候不用再折腾。
        // 换机器时 keystore 会变，届时需先卸载旧版才能覆盖安装。
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            // 包名与 release 保持一致，避免"打开方式"里出现两个同名 App
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 只留真正用到的两个：界面是 WebView + 原生对话框，
    // 用不上 Material / ConstraintLayout，省得白占几 MB 体积。
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // 扫码连接：CameraX 出预览 + ML Kit 离线条码（不依赖 Google 服务、
    // 离线识别，扫码是本地解析，不联网）。
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'

    testImplementation 'junit:junit:4.13.2'
}
