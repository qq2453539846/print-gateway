plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.printgw.selfservice'
    compileSdk 34

    defaultConfig {
        applicationId "com.printgw.selfservice"
        // minSdk 26：Android 8.0 起才有完整的自适应图标与 SAF 行为，
        // 且 8.0 以下设备已极为罕见。图标因此可以纯 vector 实现，无需位图。
        minSdk 26
        targetSdk 34
        // 每改一次 App 代码就往上加。**这个号必须在 App 里看得见** ——
        // 2026-09-19 就是栽在这：扫码修复写进了 Kotlin 源码但没重新构建，
        // 手机上跑的还是旧包，排查了半天才发现。能一眼报出版本就没有这种问题。
        versionCode 3
        versionName "1.2"
        // 构建时间戳，配置阶段现算。放在包里而不是靠文件名/记忆。
        buildConfigField "String", "BUILD_STAMP",
                "\"${new Date().format('MMdd-HHmm')}\""
    }

    signingConfigs {
        // 自用场景：release 也用 debug keystore 签名，装的时候不用再折腾。
        // 换机器时 keystore 会变，届时需先卸载旧版才能覆盖安装。
        release {
            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            // 包名与 release 保持一致，避免"打开方式"里出现两个同名 App
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        // 需要它才能用 buildConfigField（AGP 8 起默认关闭）
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 只留真正用到的两个：界面是 WebView + 原生对话框，
    // 用不上 Material / ConstraintLayout，省得白占几 MB 体积。
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // 扫码连接：CameraX 出预览 + ZXing 解码。ZXing 是纯 Java 实现（Apache-2.0），
    // 无 native 库、离线识别、不联网，也不依赖 Google 服务 —— 整个依赖树
    // 都能对上开源许可，没有专有 SDK 的合规尾巴。
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
}
