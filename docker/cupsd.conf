# 容器内 CUPS 的最小配置
#
# 只做三件事：
#   1) 在容器所有网卡上监听 631（默认的 localhost:631 只有容器自己能连）
#   2) 允许局域网提交作业 —— 没有这条，其他电脑加进来的队列会一直「等待认证」
#   3) 允许局域网进管理页（容器里跑的就是自己的 CUPS，不必再套一层）
#
# 631 绝不能映射到公网：IPP 提交作业默认免鉴权。见 README「安全边界」。

LogLevel warn
PageLogFormat
MaxLogSize 0

Listen 0.0.0.0:631
Listen /run/cups/cups.sock

# 让队列通过 mDNS 广播出去，iOS / macOS / Windows 能在「添加打印机」里自动看到
Browsing On
BrowseLocalProtocols dnssd

DefaultAuthType Basic
WebInterface Yes

<Location />
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin>
  Order allow,deny
  Allow @LOCAL
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow @LOCAL
</Location>

<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # 提交作业不要求认证：手机扫码进来的用户没有 CUPS 账号。
  # 这是本项目「内网免密」取向在 CUPS 侧的一致做法。
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
